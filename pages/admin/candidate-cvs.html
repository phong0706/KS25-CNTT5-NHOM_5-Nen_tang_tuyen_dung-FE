<!DOCTYPE html>
<html lang="vi">
<head>
  <script>(function(){try{var t=localStorage.getItem("theme")||localStorage.getItem("techrecruit_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");else document.documentElement.removeAttribute("data-theme");}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý CV Ứng viên | Admin TechRecruit</title>
  <link rel="icon" href="../../assets/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <link rel="stylesheet" href="../../css/employer-jobs.css">
  <link rel="stylesheet" href="../../css/admin-governance.css">
</head>
<body data-layout="admin" data-protected="true" data-roles="admin,operator" data-page-title="CV ứng viên" data-root="../../">

  <div id="admin-content-outlet">
    <section class="ej-page" aria-labelledby="adm-cv-heading">
      <header class="ej-header">
        <div>
          <h1 id="adm-cv-heading" class="ej-title">Danh sách CV Ứng viên đã nộp</h1>
          <p class="ej-subtitle">Tra cứu hồ sơ CV ứng viên theo tin tuyển dụng và ngày nộp. Mọi thao tác mở xem CV đều xác thực qua header và ghi nhật ký kiểm toán.</p>
        </div>
      </header>

      <div class="adm-card">
        <div class="adm-toolbar">
          <div class="adm-search-wrap">
            <span class="adm-search-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="search" id="adm-cv-search" class="adm-search-input" placeholder="Tìm theo tên ứng viên, email, vị trí hoặc tên file CV..." aria-label="Tìm kiếm CV ứng viên">
          </div>
          <button type="button" id="adm-cv-refresh" class="btn btn-outline adm-btn-action">Làm mới</button>
        </div>

        <div class="gov-table-scroll" role="region" aria-label="Bảng CV ứng viên" tabindex="0">
          <table class="gov-table" id="adm-cv-table">
            <thead>
              <tr>
                <th class="col-sticky-name">Ứng viên</th>
                <th class="col-sticky-status">Trạng thái đơn</th>
                <th>Tin đã ứng tuyển</th>
                <th>Tệp CV đính kèm</th>
                <th>Ngày nộp</th>
                <th style="text-align: right;">Thao tác</th>
              </tr>
            </thead>
            <tbody id="adm-cv-tbody">
              <tr><td colspan="6" style="text-align:center; padding:28px;">Đang tải danh sách CV...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Khung xem trước CV trực tiếp (không lộ token trên URL) -->
        <div id="adm-cv-viewer-host" style="margin-top:18px; display:none;"></div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/components/adminLayout.js"></script>
  <script src="../../js/layout.js"></script>
  <script type="module" src="../../js/pages/adminCandidateCvs.js"></script>
</body>
</html>
