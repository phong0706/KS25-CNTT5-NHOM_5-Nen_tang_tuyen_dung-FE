<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Người dùng | TechRecruit</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/admin-management.css">
</head>
<body class="admin-management" data-layout="admin" data-protected="true" data-roles="admin" data-page-title="Quản lý Người dùng" data-root="../../">
  <div id="admin-content-outlet">
    <header class="admin-page-intro">
      <div>
        <h1>Người dùng</h1>
        <p>Quản lý tài khoản, vai trò và trạng thái truy cập.</p>
      </div>
    </header>

    <section class="card admin-panel" aria-labelledby="users-heading">
      <div class="admin-panel-heading">
        <div>
          <h2 id="users-heading">Danh sách tài khoản</h2>
          <p>Tìm kiếm và lọc người dùng trong hệ thống.</p>
        </div>
        <div class="admin-user-filters" role="search">
          <label class="admin-search">
            <span class="sr-only">Tìm theo tên hoặc email</span>
            <input type="search" id="search-user-input" placeholder="Tìm tên, email..." autocomplete="off">
          </label>
          <select id="filter-role" aria-label="Lọc theo vai trò">
            <option value="">Tất cả vai trò</option>
            <option value="candidate">Ứng viên</option>
            <option value="employer">Nhà tuyển dụng</option>
            <option value="admin">Quản trị viên</option>
          </select>
          <select id="filter-status" aria-label="Lọc theo trạng thái">
            <option value="">Tất cả trạng thái</option>
            <option value="true">Đang hoạt động</option>
            <option value="false">Đã khoá</option>
          </select>
          <button id="btn-refresh-users" class="btn btn-outline" type="button">Làm mới</button>
        </div>
      </div>

      <div class="table-wrap" id="users-table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Người dùng</th>
              <th scope="col">Email</th>
              <th scope="col">Vai trò</th>
              <th scope="col">Trạng thái</th>
              <th scope="col" class="actions">Thao tác</th>
            </tr>
          </thead>
          <tbody id="users-table-body" aria-live="polite">
            <tr><td colspan="6" class="muted admin-table-message">Đang tải danh sách...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/pages/admin-users.js?v=20261117"></script>
</body>
</html>
