<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Việc làm đã lưu | TechRecruit</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/site-header.css">
  <link rel="stylesheet" href="../../css/job-grid-card.css">
  <link rel="stylesheet" href="../../css/candidate-applications.css">
  <link rel="stylesheet" href="../../css/jobs.css">
  <link rel="stylesheet" href="../../css/candidate-saved-jobs.css">
</head>
<body data-root="../../" data-layout="main">
  <header id="app-header"></header>

  <main class="saved-jobs-page">
    <div class="container">
      <div class="apps-page-header">
        <div class="apps-header-left">
          <nav class="apps-breadcrumb" aria-label="Đường dẫn">
            <a href="/frontend/index.html" data-route="home">Trang chủ</a>
            <span class="meta-dot">/</span>
            <span aria-current="page">Việc làm đã lưu</span>
          </nav>
          <h1 class="apps-page-title">Việc làm đã lưu</h1>
        </div>
        <div class="apps-header-right">
          <a href="/frontend/pages/jobs.html" data-route="jobs" class="btn btn-primary apps-find-job-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>Khám phá việc làm</span>
          </a>
        </div>
      </div>

      <!-- Toolbar: Ô tìm kiếm + CustomSelect Sắp xếp -->
      <div class="apps-toolbar">
        <div class="apps-search-wrap">
          <svg class="apps-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input
            type="search"
            id="saved-jobs-search-input"
            class="apps-search-input"
            placeholder="Tìm theo tên vị trí, công ty hoặc địa điểm..."
            aria-label="Tìm kiếm theo vị trí hoặc công ty"
            autocomplete="off"
          />
        </div>
        <div class="apps-sort-wrap">
          <label for="saved-jobs-sort-select" class="apps-sort-label">Sắp xếp:</label>
          <div id="saved-jobs-sort-host"></div>
        </div>
      </div>

      <!-- Live summary -->
      <div class="apps-results-meta">
        <span id="saved-jobs-summary" class="apps-count-summary" aria-live="polite">Đang nạp dữ liệu...</span>
      </div>

      <!-- Danh sách việc làm đã lưu -->
      <section id="saved-jobs-list-host" class="saved-jobs-list" aria-live="polite"></section>

      <!-- Phân trang -->
      <nav id="saved-jobs-pagination-host" class="jobs-pagination" aria-label="Phân trang danh sách việc làm đã lưu" hidden></nav>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/layout.js"></script>
  <script type="module" src="../../js/siteHeaderBoot.js"></script>
  <script src="../../js/components/customSelect.js"></script>
  <script type="module" src="../../js/pages/candidateSavedJobs.js"></script>
</body>
</html>
