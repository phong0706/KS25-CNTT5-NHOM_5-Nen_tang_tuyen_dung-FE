<!DOCTYPE html>
<html lang="vi">
<head>
  <script>(function(){try{var t=localStorage.getItem("theme")||localStorage.getItem("techrecruit_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");else document.documentElement.removeAttribute("data-theme");}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình Tạo CV Tương Tác A4 | TechRecruit</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/site-header.css">
  <link rel="stylesheet" href="../../css/cv-builder.css">
  <link rel="stylesheet" href="../../css/cv-print.css">
</head>
<body data-root="../../" data-layout="main">
  <header id="app-header"></header>

  <main style="padding: 20px 0 60px;">
    <div class="container" style="max-width: 1360px; margin: 0 auto; padding: 0 16px;">
      <nav class="breadcrumb" style="display:flex; gap:8px; font-size:13px; color:var(--text-tertiary); margin-bottom:12px;" aria-label="Đường dẫn">
        <a href="/frontend/index.html" data-route="home" style="color:inherit; text-decoration:none;">Trang chủ</a>
        <span>/</span>
        <a href="/frontend/pages/candidate/cv-manage.html" data-route="cv-manage" style="color:inherit; text-decoration:none;">Quản lý CV</a>
        <span>/</span>
        <span aria-current="page" style="color:var(--text-primary); font-weight:600;">Trình tạo CV</span>
      </nav>

      <!-- Thanh công cụ điều khiển phía trên -->
      <div class="cv-builder-toolbar" style="background:var(--bg); border:1px solid var(--border-default); border-radius:12px; padding:12px 18px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; box-shadow:var(--shadow-sm);">
        <div style="display:flex; align-items:center; gap:12px; flex:1; min-width:280px;">
          <input type="text" id="doc-title-input" style="font-size:16px; font-weight:700; color:var(--text-primary); background:transparent; border:1px dashed var(--border-default); border-radius:6px; padding:6px 10px; width:100%; max-width:340px;" placeholder="Tên tài liệu CV...">
          <div id="save-status" style="font-size:12.5px; color:var(--text-tertiary); white-space:nowrap;">Tự lưu sau 30s</div>
        </div>

        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:13px; font-weight:600; color:var(--text-secondary);">Mẫu:</span>
            <div id="template-switcher-host" style="min-width:190px;"></div>
          </div>

          <button type="button" class="btn btn-outline" id="btn-manual-save" style="padding:8px 14px; font-size:13px; font-weight:600;">Lưu bản ghi</button>
          <button type="button" class="btn btn-primary" id="btn-print-pdf" style="padding:8px 16px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            Tải PDF / In CV
          </button>
        </div>
      </div>

      <!-- Không gian làm việc 2 cột -->
      <div class="cv-builder-layout">
        <!-- Cột trái: Form nhập liệu theo khối -->
        <div class="cv-builder-left" id="cv-form-container">
          <!-- Render bởi cvBuilderForm.js -->
        </div>

        <!-- Cột phải: Live A4 Preview -->
        <div class="cv-preview-panel" id="cv-preview-panel">
          <div class="cv-paper-sheet" id="cv-preview-sheet">
            <!-- Render trực tiếp bởi cvTemplates.js -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/components/customSelect.js"></script>
  <script type="module" src="../../js/siteHeaderBoot.js"></script>
  <script type="module" src="../../js/pages/cvBuilderPage.js"></script>
</body>
</html>
