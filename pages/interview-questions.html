<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ngân hàng câu hỏi phỏng vấn IT | TechRecruit</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    .interview-page { padding: 32px 0 64px; }
    .interview-header { margin-bottom: 24px; }
    .interview-title { font-size: 26px; font-weight: 700; color: var(--text-primary); }
    .interview-filters { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .q-card {
      background: var(--bg);
      border: 1px solid var(--border-default);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      transition: border-color 140ms ease;
    }
    .q-card:hover { border-color: var(--primary-500); }
    .q-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .q-text { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    .q-tags { display: flex; gap: 8px; margin-bottom: 12px; }
    .q-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--bg-alt); color: var(--text-secondary); text-transform: uppercase; }
    .q-toggle-btn {
      background: transparent;
      border: none;
      color: var(--primary-700);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .q-answer-box {
      margin-top: 12px;
      padding: 14px;
      background: var(--bg-alt);
      border-left: 3px solid var(--primary-700);
      border-radius: 4px;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      display: none;
    }
    .q-card.is-open .q-answer-box { display: block; }
    .q-practice-btn {
      padding: 6px 12px;
      font-size: 12.5px;
      border-radius: 6px;
      border: 1px solid var(--border-default);
      background: var(--bg);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .q-practice-btn.is-practiced {
      background: var(--primary-50);
      border-color: var(--primary-500);
      color: var(--primary-800);
      font-weight: 600;
    }
  </style>
</head>
<body data-root="../" data-layout="main">
  <header id="app-header"></header>

  <main class="interview-page">
    <div class="container">
      <div class="interview-header">
        <h1 class="interview-title">Ngân hàng câu hỏi phỏng vấn kỹ thuật</h1>
        <p style="color:var(--text-tertiary); margin-top:4px;">Tổng hợp câu hỏi phỏng vấn phổ biến kèm gợi ý trả lời từ các chuyên gia tuyển dụng TechRecruit.</p>
      </div>

      <div class="interview-filters">
        <div style="min-width: 180px;" id="filter-field-host"></div>
        <div style="min-width: 180px;" id="filter-level-host"></div>
      </div>

      <section id="questions-list-container" aria-live="polite">
        <div style="color:var(--text-tertiary); padding:32px 0;">Đang nạp câu hỏi...</div>
      </section>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script type="module" src="../js/megaInit.js"></script>
  <script src="../js/components/customSelect.js"></script>
  <script type="module" src="../js/pages/interviewPage.js"></script>
</body>
</html>
