<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Công ty công nghệ đang tuyển | TechRecruit</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/site-header.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/candidate-profile.css">
  <link rel="stylesheet" href="../css/employer-job-form.css">
  <link rel="stylesheet" href="../css/jobs.css">
  <link rel="stylesheet" href="../css/job-grid-card.css">
  <link rel="stylesheet" href="../css/apply-modal.css">
  <link rel="stylesheet" href="../css/apply-modal-cv.css">
  <link rel="stylesheet" href="../css/companies.css">
</head>
<body data-root="../" data-layout="main">
  <header id="app-header"></header>

  <main class="companies-page">
    <div class="container">
      <section class="companies-hero">
        <nav class="companies-breadcrumb" aria-label="Đường dẫn">
          <a href="../index.html">Trang chủ</a>
          <span aria-hidden="true">/</span>
          <span aria-current="page">Công ty</span>
        </nav>
        <h1 class="companies-page-title">Công ty công nghệ đang tuyển</h1>
        <p id="companies-hero-subtitle" class="companies-page-desc">Đang tổng hợp dữ liệu doanh nghiệp công nghệ và vị trí đang mở...</p>

        <form id="companies-search-form" class="companies-search-box" role="search" autocomplete="off">
          <div class="search-field companies-search-field">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input
              type="search"
              id="companies-search-input"
              placeholder="Tìm tên công ty, công nghệ hoặc khu vực..."
              aria-label="Tìm tên công ty"
              aria-autocomplete="list"
              aria-controls="companies-suggest-box"
              aria-expanded="false"
            >
            <button type="submit" class="btn btn-primary companies-search-submit">Tìm</button>
          </div>
          <ul id="companies-suggest-box" class="companies-suggest-box" role="listbox" aria-label="Gợi ý công ty" hidden></ul>
        </form>
      </section>

      <div class="companies-controls-bar">
        <button type="button" id="btn-open-filter-drawer" class="btn btn-outline companies-mobile-filter-btn" aria-haspopup="dialog" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
          <span id="mobile-filter-label">Bộ lọc (0)</span>
        </button>

        <div id="companies-filter-backdrop" class="companies-filter-backdrop" hidden></div>
        <div id="companies-filter-panel" class="companies-filter-panel" role="region" aria-label="Bộ lọc danh sách công ty">
          <div class="companies-drawer-head">
            <h2>Bộ lọc công ty</h2>
            <button type="button" id="btn-close-filter-drawer" class="companies-drawer-close" aria-label="Đóng bộ lọc">&times;</button>
          </div>
          <div class="companies-filter-fields">
            <div id="filter-industry-host" class="companies-select-host"></div>
            <div id="filter-location-host" class="companies-select-host"></div>
            <div id="filter-size-host" class="companies-select-host"></div>
            <label class="companies-hiring-switch" for="filter-hiring-toggle">
              <input type="checkbox" id="filter-hiring-toggle" checked>
              <span class="companies-switch-track" aria-hidden="true"></span>
              <span>Chỉ công ty đang tuyển</span>
            </label>
          </div>
          <div class="companies-drawer-foot">
            <button type="button" id="btn-drawer-reset" class="btn btn-outline">Xóa lọc</button>
            <button type="button" id="btn-drawer-apply" class="btn btn-primary">Xem kết quả</button>
          </div>
        </div>

        <div id="filter-sort-host" class="companies-sort-host"></div>
      </div>

      <div id="companies-active-chips" class="companies-active-chips" aria-label="Bộ lọc đang áp dụng" hidden></div>

      <div class="companies-meta-row">
        <p id="companies-summary" class="companies-summary" tabindex="-1" aria-live="polite">Đang tải danh sách công ty...</p>
      </div>

      <section id="companies-grid-host" class="companies-grid" aria-label="Danh sách công ty"></section>

      <nav id="companies-pagination-host" class="jobs-pagination" aria-label="Phân trang danh sách công ty" hidden></nav>

      <section id="companies-recent-section" class="companies-recent-section" hidden>
        <div class="companies-section-head">
          <h2>Mới đăng tin gần đây</h2>
          <p>Các doanh nghiệp vừa cập nhật vị trí tuyển dụng mới nhất</p>
        </div>
        <div id="companies-recent-grid" class="companies-recent-grid"></div>
      </section>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script type="module" src="../js/siteHeaderBoot.js"></script>
  <script src="../js/components/customSelect.js"></script>
  <script type="module" src="../js/pages/companiesPage.js"></script>
</body>
</html>
