<!DOCTYPE html>
<html lang="vi">
<head>
  <script>(function(){try{var t=localStorage.getItem("theme")||localStorage.getItem("techrecruit_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");else document.documentElement.removeAttribute("data-theme");}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khám phá công ty IT hàng đầu | TechRecruit</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/site-header.css">
  <link rel="stylesheet" href="../css/jobs.css">
  <link rel="stylesheet" href="../css/companies.css">
</head>
<body data-root="../" data-layout="main">
  <header id="app-header"></header>

  <main class="companies-page">
    <div class="container">
      <div class="companies-header">
        <nav class="breadcrumb" style="display:flex; gap:8px; font-size:13px; color:var(--text-tertiary); margin-bottom:16px;" aria-label="Đường dẫn">
          <a href="../index.html" style="color:inherit; text-decoration:none;">Trang chủ</a>
          <span>/</span>
          <span aria-current="page">Danh sách công ty</span>
        </nav>
        <h1 class="companies-page-title">Danh sách công ty IT</h1>
        <p class="companies-page-desc">Khám phá các doanh nghiệp công nghệ hàng đầu với môi trường làm việc lý tưởng và chế độ đãi ngộ vượt trội.</p>
      </div>

      <!-- Toolbar: Tìm kiếm tên + Lọc ngành (CustomSelect) + Sắp xếp (CustomSelect) -->
      <div class="companies-toolbar">
        <div class="companies-search-wrap">
          <svg class="companies-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input
            type="search"
            id="companies-search-input"
            class="companies-search-input"
            placeholder="Tìm theo tên công ty hoặc địa chỉ..."
            aria-label="Tìm theo tên công ty hoặc địa chỉ"
            autocomplete="off"
          />
        </div>
        <div class="companies-filter-group">
          <div id="companies-industry-host"></div>
          <div id="companies-sort-host"></div>
        </div>
      </div>

      <!-- Live summary -->
      <div class="apps-results-meta" style="margin-bottom: 16px;">
        <span id="companies-summary" class="apps-count-summary" aria-live="polite">Đang nạp dữ liệu...</span>
      </div>

      <!-- Lưới công ty -->
      <section id="companies-grid-host" class="companies-grid" aria-live="polite"></section>

      <!-- Phân trang -->
      <nav id="companies-pagination-host" class="jobs-pagination" aria-label="Phân trang danh sách công ty" hidden></nav>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script type="module" src="../js/siteHeaderBoot.js"></script>
  <script src="../js/components/customSelect.js"></script>
  <script type="module" src="../js/pages/companiesPage.js"></script>
</body>
</html>
