<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tính năng đang phát triển | TechRecruit</title>
  <script>
    (function () {
      const feat = new URLSearchParams(window.location.search).get("feature");
      if (feat === "cv-upload" || feat === "cvs") {
        window.location.replace("candidate/cvs.html?upload=1");
      }
      if (feat === "unemployment-insurance") {
        window.location.replace("tools/unemployment-insurance.html");
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/site-header.css">
  <link rel="stylesheet" href="../css/placeholder.css">
  <link rel="stylesheet" href="../css/role-orientation.css">
</head>
<body data-root="../" data-layout="main">
  <header id="app-header"></header>

  <main style="padding: 24px 0 64px; min-height: 70vh;">
    <div class="container">
      <nav class="breadcrumb" style="display:flex; gap:8px; font-size:13px; color:var(--text-tertiary); margin-bottom:16px;" aria-label="Đường dẫn">
        <a href="../index.html" style="color:inherit; text-decoration:none;">Trang chủ</a>
        <span>/</span>
        <span id="breadcrumb-group" style="color:inherit;"></span>
        <span id="breadcrumb-sep">/</span>
        <span id="breadcrumb-current" aria-current="page" style="color:var(--text-primary); font-weight:600;">Tính năng mới</span>
      </nav>

      <div id="placeholder-content">
        <!-- Khối căn giữa max-width 560px cách header 96px render bởi placeholder.js -->
      </div>

      <div id="placeholder-suggestions">
        <!-- 3 thẻ gợi ý cùng nhóm có status ready -->
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script type="module" src="../js/siteHeaderBoot.js"></script>
  <script type="module" src="../js/pages/placeholder.js"></script>
</body>
</html>
