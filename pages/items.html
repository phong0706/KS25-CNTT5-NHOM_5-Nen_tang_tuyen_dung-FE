<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duyệt tin tuyển dụng | Admin TechRecruit</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/items.css">
  <link rel="stylesheet" href="../css/admin-governance.css">
</head>
<body data-layout="admin" data-protected="true" data-roles="admin,operator" data-root="../" data-page-title="Duyệt tin tuyển dụng">

  <div id="admin-content-outlet">
    <section class="ej-page" aria-labelledby="page-title">
      <header class="ej-header" style="margin-bottom:16px;">
        <div>
          <h1 id="page-title" class="ej-title">Duyệt tin tuyển dụng</h1>
          <p class="ej-subtitle">Kiểm tra nội dung tin tuyển dụng trước khi công khai hoặc gỡ bỏ tin không phù hợp.</p>
        </div>
      </header>

      <div class="adm-card">
        <!-- Tab chuyển trạng thái: Chờ duyệt, Đang tuyển & Logo chờ duyệt -->
        <div class="verif-filter-tabs" role="tablist" aria-label="Bộ lọc trạng thái duyệt tin" style="margin-bottom:14px;">
          <button type="button" role="tab" id="tab-pending" class="verif-filter-btn is-active" aria-selected="true">
            <span>Chờ duyệt</span>
            <span class="verif-count-pill" id="badge-pending">0</span>
          </button>
          <button type="button" role="tab" id="tab-published" class="verif-filter-btn" aria-selected="false">
            <span>Đang tuyển</span>
            <span class="verif-count-pill" id="badge-published">0</span>
          </button>
          <button type="button" role="tab" id="tab-logo-pending" class="verif-filter-btn" aria-selected="false">
            <span>Logo chờ duyệt</span>
            <span class="verif-count-pill" id="badge-logo-pending">0</span>
          </button>
        </div>

        <div id="adm-job-msg" role="status" aria-live="polite" hidden style="margin-bottom:12px; padding:10px 14px; border-radius:var(--radius-md); font-size:13.5px;"></div>

        <div class="adm-toolbar">
          <div class="adm-search-wrap">
            <span class="adm-search-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="search" id="search-input" class="adm-search-input" placeholder="Tìm theo vị trí hoặc tên công ty..." aria-label="Tìm kiếm tin tuyển dụng">
          </div>
          <button type="button" id="btn-refresh" class="btn btn-outline adm-btn-action">Làm mới</button>
        </div>

        <div class="gov-table-scroll" role="region" aria-label="Danh sách tin tuyển dụng" tabindex="0">
          <table class="gov-table" id="job-table">
            <thead>
              <tr>
                <th class="col-sticky-name">Vị trí tuyển dụng</th>
                <th>Công ty</th>
                <th>Người gửi</th>
                <th>Ngày gửi</th>
                <th>Trạng thái</th>
                <th class="text-right">Thao tác</th>
              </tr>
            </thead>
            <tbody id="job-table-body">
              <tr><td colspan="6" style="text-align:center; padding:28px;">Đang tải danh sách tin...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Modal xác nhận xóa tin tuyển dụng -->
    <div id="job-modal-host"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components/adminLayout.js"></script>
  <script src="../js/layout.js"></script>
  <script type="module" src="../js/pages/items.js"></script>
</body>
</html>
