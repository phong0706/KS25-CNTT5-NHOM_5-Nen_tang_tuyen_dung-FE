<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 — Không có quyền truy cập | TechRecruit</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    .error-page-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      background-color: var(--bg-app);
    }
    .error-page-box {
      max-width: 480px;
      margin-inline: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .error-svg-wrap {
      color: var(--status-danger-text, #BE123C);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error-code-badge {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--status-danger-text, #BE123C);
      background-color: var(--status-danger-bg, #FFF1F2);
      border: 1px solid var(--status-danger-border, #FECDD3);
      padding: 4px 12px;
      border-radius: var(--radius-full);
    }
    .error-heading {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
      text-wrap: balance;
    }
    .error-desc {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin: 0;
      text-wrap: balance;
    }
    .error-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }
    .error-btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 24px;
      border-radius: var(--radius-md, 8px);
      background-color: var(--primary-700);
      color: var(--text-on-primary, #FFFFFF);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color var(--transition-fast);
    }
    .error-btn-primary:hover {
      background-color: var(--primary-800);
      color: var(--text-on-primary, #FFFFFF);
      text-decoration: none;
    }
    .error-btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 20px;
      border-radius: var(--radius-md, 8px);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-default);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color var(--transition-fast), background-color var(--transition-fast);
    }
    .error-btn-secondary:hover {
      border-color: var(--primary-700);
      background-color: var(--bg-subtle);
      text-decoration: none;
    }
  </style>
</head>
<body data-root="../" data-layout="main">
  <header id="app-header"></header>

  <main class="error-page-section">
    <div class="container">
      <div class="error-page-box">
        <!-- Minh họa SVG đơn giản dùng currentColor và biến màu design system -->
        <div class="error-svg-wrap" aria-hidden="true">
          <svg width="56" height="56" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 10L50 18V31C50 42.5 42.3 51.8 32 55C21.7 51.8 14 42.5 14 31V18L32 10Z" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.35" stroke-linejoin="round" />
            <rect x="24" y="30" width="16" height="13" rx="3" stroke="currentColor" stroke-width="2.5" />
            <path d="M27.5 30V26C27.5 23.5147 29.5147 21.5 32 21.5C34.4853 21.5 36.5 23.5147 36.5 26V30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
            <circle cx="32" cy="36.5" r="1.75" fill="currentColor" />
          </svg>
        </div>

        <h1 class="error-heading">403 — Bạn không có quyền truy cập trang này</h1>
        <p class="error-desc">
          Tài khoản hiện tại không đủ phân quyền cho khu vực này. Vui lòng đăng nhập đúng vai trò hoặc quay lại trang chủ.
        </p>

        <div class="error-actions">
          <a href="../index.html" class="error-btn-primary">Về trang chủ</a>
          <a href="login.html" class="error-btn-secondary">Đăng nhập tài khoản khác</a>
        </div>
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
</body>
</html>
