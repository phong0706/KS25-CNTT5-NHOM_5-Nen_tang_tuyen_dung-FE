<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết việc làm | TechRecruit</title>
  <meta name="description" content="Xem chi tiết vị trí, yêu cầu công việc và ứng tuyển ngay trên TechRecruit.">
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/site-header.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/job-grid-card.css">
  <link rel="stylesheet" href="../css/job-detail.css">
  <link rel="stylesheet" href="../css/apply-modal.css">
  <link rel="stylesheet" href="../css/apply-modal-cv.css">
</head>

<body data-root="../" data-layout="main">
  <header id="app-header"></header>

  <main class="jd-page">
    <div class="container">
      <nav class="jd-breadcrumb" aria-label="Đường dẫn">
        <a href="../index.html">Trang chủ</a>
        <span class="jd-crumb-sep" aria-hidden="true">/</span>
        <a href="./jobs.html">Việc làm</a>
        <span class="jd-crumb-sep" aria-hidden="true">/</span>
        <span class="jd-breadcrumb-current" id="jd-crumb-title" aria-current="page">Chi tiết việc làm</span>
      </nav>

      <!-- Trạng thái tải / lỗi -->
      <div id="jd-loading" class="jd-state" role="status" aria-live="polite">
        <div class="jd-skeleton jd-skeleton-logo"></div>
        <div class="jd-skeleton jd-skeleton-title"></div>
        <div class="jd-skeleton jd-skeleton-line"></div>
        <div class="jd-skeleton jd-skeleton-block"></div>
      </div>

      <div id="jd-error" class="jd-state jd-state--error" role="alert" hidden>
        <h1 class="jd-state-title">Không tìm thấy tin tuyển dụng</h1>
        <p class="jd-state-desc" id="jd-error-msg">Tin tuyển dụng này có thể đã được gỡ bỏ hoặc chưa được công bố.</p>
        <div class="jd-state-actions">
          <a href="./jobs.html" class="btn btn-primary">Tìm việc làm khác</a>
          <a href="../index.html" class="btn btn-outline">Về trang chủ</a>
        </div>
      </div>

      <!-- Khung chứa nội dung chi tiết 1 cột chuẩn -->
      <div id="jd-content" class="jd-content-container" hidden></div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/components/customSelect.js"></script>
  <script type="module" src="../js/siteHeaderBoot.js"></script>
  <script type="module" src="../js/pages/jobDetail.js"></script>
</body>

</html>
